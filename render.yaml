# render.yaml — Render Blueprint for VIZHI
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy the full stack in one click:
#   1. Push this repo to GitHub
#   2. Go to render.com → New → Blueprint
#   3. Connect the PRAVEEN-P-55/VIZHI repo
#   4. Fill in secret env vars when prompted (JWT_SECRET, ANTHROPIC_API_KEY)
#   5. Click "Apply"

databases:
  - name: vizhi-db
    databaseName: vizhi
    user: vizhi
    plan: free
    region: singapore

services:
  # Backend (FastAPI)
  - type: web
    name: vizhi-backend
    region: singapore
    plan: free
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vizhi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://vizhi-frontend.onrender.com
      - key: REDIS_URL
        value: ""
      - key: ANTHROPIC_API_KEY
        value: ""
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: SMTP_USE_TLS
        value: "true"
      - key: ALERT_EMAIL_FROM
        value: ""
      - key: ALERT_EMAIL_TO
        value: ""
      - key: SMS_WEBHOOK_URL
        value: ""
      - key: ALERT_WEBHOOK_URL
        value: ""

  # Frontend (React + Nginx)
  - type: web
    name: vizhi-frontend
    region: singapore
    plan: free
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
    envVars:
      - key: BACKEND_URL
        value: https://vizhi-backend.onrender.com
