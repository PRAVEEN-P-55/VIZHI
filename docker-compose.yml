services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: vizhi
      POSTGRES_USER: vizhi
      POSTGRES_PASSWORD: vizhi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vizhi"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - vizhi_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - vizhi_redis:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://vizhi:vizhi@postgres:5432/vizhi
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-vizhi-local-compose-secret-change-me}
      CORS_ORIGINS: http://localhost:8080
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  vizhi_postgres:
  vizhi_redis:
